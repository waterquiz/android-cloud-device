# ==============================================================================
# Android Cloud Device Configuration
# ==============================================================================

# Hardware Resources
RAM_SIZE="2048"            # Device RAM in Megabytes (e.g., 2048)
CPU_CORES="2"              # Number of virtual CPU cores
DISK_SIZE="8G"             # Data partition size (e.g., 8G)

# Display Settings
DISPLAY_WIDTH="720"        # Display width in pixels
DISPLAY_HEIGHT="1280"      # Display height in pixels
DISPLAY_DPI="240"          # Pixel density (DPI)

# Networking & Local Ports
# Note: These ports are bound strictly to localhost (127.0.0.1) and never exposed publicly.
ADB_PORT="5555"            # Internal ADB daemon port
VNC_PORT="5900"            # Internal QEMU VNC display port

# Storage Locations
DATA_DIR="/data"           # Persistent mount point in Railway

# Virtualization Settings
# When running inside a Railway container where /dev/kvm is not provided:
# - "false" (default): Fails safely with clear diagnostics, preventing CPU starvation.
# - "true": Attempts software emulation (QEMU TCG). Expect high CPU usage and slow boot times.
ALLOW_SOFTWARE_EMULATION="${ALLOW_SOFTWARE_EMULATION:-true}"

# Security & Upload Limits
MAX_UPLOAD_MB="250"        # Maximum allowed APK upload size in megabytes
